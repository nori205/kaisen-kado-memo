<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>回線稼働メモ</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2563eb">
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --border: #e2e4e9;
    --text: #1f2430;
    --sub: #6b7280;
    --accent: #2563eb;
    --accent-bg: #eaf1ff;
    --danger: #dc2626;
    --w-phone: 116px;
    --w-memo: 92px;
    --w-del: 32px;
    --w-month: 34px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 80px;
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 16px 16px 12px;
  }
  header h1 {
    font-size: 18px;
    margin: 0 0 2px;
  }
  header .year {
    font-size: 13px;
    color: var(--sub);
  }
  main {
    padding: 12px;
  }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 4px 8px;
  }
  .hint {
    font-size: 12px;
    color: var(--sub);
  }
  .reset-btn {
    font-size: 12px;
    color: var(--sub);
    background: none;
    border: none;
    text-decoration: underline;
    padding: 4px;
    cursor: pointer;
  }
  .table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--card);
  }
  table {
    border-collapse: collapse;
    width: max-content;
  }
  th, td {
    border-bottom: 1px solid var(--border);
    padding: 0;
    text-align: center;
    font-size: 12px;
  }
  thead th {
    position: sticky;
    top: 0;
    background: #fafbfc;
    z-index: 3;
    padding: 8px 2px;
    color: var(--sub);
    font-weight: 600;
    white-space: nowrap;
  }
  .col-phone, .col-memo, .col-del {
    position: sticky;
    background: var(--card);
    z-index: 2;
  }
  thead .col-phone, thead .col-memo, thead .col-del {
    z-index: 4;
    background: #fafbfc;
  }
  .col-phone { left: 0; width: var(--w-phone); min-width: var(--w-phone); text-align: left; border-right: 1px solid var(--border); }
  .col-memo { left: var(--w-phone); width: var(--w-memo); min-width: var(--w-memo); text-align: left; border-right: 1px solid var(--border); }
  .col-del { left: calc(var(--w-phone) + var(--w-memo)); width: var(--w-del); min-width: var(--w-del); border-right: 1px solid var(--border); }
  .col-month { width: var(--w-month); min-width: var(--w-month); }
  td.col-phone, td.col-memo {
    padding: 4px 6px;
  }
  .cell-input {
    width: 100%;
    border: none;
    background: transparent;
    font-size: 13px;
    padding: 6px 2px;
    color: var(--text);
    min-width: 0;
  }
  .cell-input:focus {
    outline: none;
    background: var(--accent-bg);
    border-radius: 6px;
  }
  .del-btn {
    width: 100%;
    height: 100%;
    min-height: 40px;
    border: none;
    background: transparent;
    color: var(--sub);
    font-size: 15px;
    cursor: pointer;
  }
  .del-btn:active {
    color: var(--danger);
  }
  td.col-month {
    height: 40px;
  }
  .month-check {
    width: 22px;
    height: 22px;
    accent-color: var(--accent);
  }
  tr.checked-row-hover td.col-month { background: var(--accent-bg); }
  .empty {
    text-align: center;
    color: var(--sub);
    font-size: 14px;
    padding: 40px 20px;
  }
  .fab-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 60%, transparent);
  }
  .add-btn {
    display: block;
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    padding: 14px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  .add-btn:active {
    background: #1d4ed8;
  }
</style>
</head>
<body>
<header>
  <h1>回線稼働メモ</h1>
  <div class="year"><span id="yearLabel"></span>年の稼働チェック</div>
</header>
<main>
  <div class="toolbar">
    <span class="hint">横スクロールで月を確認できます</span>
    <button class="reset-btn" id="clearBtn" type="button">全チェックをクリア</button>
  </div>
  <div class="table-wrap">
    <table id="gridTable">
      <thead>
        <tr id="headRow">
          <th class="col-phone">電話番号</th>
          <th class="col-memo">メモ</th>
          <th class="col-del"></th>
        </tr>
      </thead>
      <tbody id="listBody"></tbody>
    </table>
  </div>
  <div class="empty" id="emptyMsg" hidden>まだ回線がありません。下のボタンから追加してください。</div>
</main>
<div class="fab-bar">
  <button class="add-btn" id="addBtn" type="button">＋ 回線を追加</button>
</div>

<script>
const STORAGE_KEY = 'kaisen-kado-memo';
const MONTHS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    const lines = Array.isArray(raw.lines) ? raw.lines : [];
    lines.forEach(l => {
      if (typeof l.memo !== 'string') l.memo = '';
      if (!Array.isArray(l.months)) l.months = new Array(12).fill(false);
    });
    return { year: raw.year || new Date().getFullYear(), lines };
  } catch {
    return { year: new Date().getFullYear(), lines: [] };
  }
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

let state = load();
state.year = new Date().getFullYear();

const headRow = document.getElementById('headRow');
const listBody = document.getElementById('listBody');
const emptyMsg = document.getElementById('emptyMsg');
document.getElementById('yearLabel').textContent = state.year;

MONTHS.forEach(label => {
  const th = document.createElement('th');
  th.className = 'col-month';
  th.textContent = label.replace('月', '');
  headRow.appendChild(th);
});

function render() {
  listBody.innerHTML = '';
  emptyMsg.hidden = state.lines.length > 0;

  state.lines.forEach((line, idx) => {
    const tr = document.createElement('tr');

    const phoneTd = document.createElement('td');
    phoneTd.className = 'col-phone';
    const phoneInput = document.createElement('input');
    phoneInput.className = 'cell-input';
    phoneInput.type = 'tel';
    phoneInput.placeholder = '電話番号';
    phoneInput.value = line.phone || '';
    phoneInput.addEventListener('input', () => {
      line.phone = phoneInput.value;
      save();
    });
    phoneTd.appendChild(phoneInput);
    tr.appendChild(phoneTd);

    const memoTd = document.createElement('td');
    memoTd.className = 'col-memo';
    const memoInput = document.createElement('input');
    memoInput.className = 'cell-input';
    memoInput.type = 'text';
    memoInput.placeholder = 'メモ';
    memoInput.value = line.memo || '';
    memoInput.addEventListener('input', () => {
      line.memo = memoInput.value;
      save();
    });
    memoTd.appendChild(memoInput);
    tr.appendChild(memoTd);

    const delTd = document.createElement('td');
    delTd.className = 'col-del';
    const delBtn = document.createElement('button');
    delBtn.className = 'del-btn';
    delBtn.type = 'button';
    delBtn.textContent = '✕';
    delBtn.addEventListener('click', () => {
      if (confirm('この回線を削除しますか？')) {
        state.lines.splice(idx, 1);
        save();
        render();
      }
    });
    delTd.appendChild(delBtn);
    tr.appendChild(delTd);

    MONTHS.forEach((_, mIdx) => {
      const td = document.createElement('td');
      td.className = 'col-month';
      const cb = document.createElement('input');
      cb.className = 'month-check';
      cb.type = 'checkbox';
      cb.checked = !!line.months[mIdx];
      cb.addEventListener('change', () => {
        line.months[mIdx] = cb.checked;
        save();
      });
      td.appendChild(cb);
      tr.appendChild(td);
    });

    listBody.appendChild(tr);
  });
}

document.getElementById('addBtn').addEventListener('click', () => {
  state.lines.push({ phone: '', memo: '', months: new Array(12).fill(false) });
  save();
  render();
});

document.getElementById('clearBtn').addEventListener('click', () => {
  if (!state.lines.length) return;
  if (confirm('すべての回線のチェックをクリアしますか？（電話番号・メモは残ります）')) {
    state.lines.forEach(line => { line.months = new Array(12).fill(false); });
    save();
    render();
  }
});

render();
</script>
</body>
</html>
